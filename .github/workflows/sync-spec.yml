name: Sync spec

# Regenerating and releasing are different things, and this workflow is the first half.
#
# utos/api fires `spec-released` on every spec release. What arrives with it is INPUT TO WORK:
# new protos, and a conformance corpus that asserts rules nothing here implements yet. That is
# the normal order — fixtures arrive with the spec, implementations follow them — so the arrival
# of a spec is not the moment to publish anything.
#
# So this opens a pull request against `dev` carrying the regenerated source, and stops. A human
# reviews it, merges it, writes the implementation the new corpus demands, and releases when the
# repo is actually ready. `release.yml` is the second half and runs off `main`.
#
# What this replaces: the dispatch used to regenerate AND publish, straight off `main`. That is
# how `Utos.Workflow.Validation 0.0.18` reached nuget.org without implementing a single rule of
# spec 0.0.18 — its version named a spec it had not been taught. A version can only mean "the
# spec I implement" if a person decides when that is true.

on:
  repository_dispatch:
    types: [spec-released]
  workflow_dispatch:
    inputs:
      api_ref:
        description: 'utos/api tag to sync, e.g. v0.19.0 (empty = latest released tag)'
        required: false
        default: ''

permissions:
  contents: write        # push the sync branch
  pull-requests: write   # open the PR

concurrency:
  group: sync-spec
  cancel-in-progress: false

env:
  API_REPO: utos/api

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve the spec tag
        id: spec
        run: |
          set -euo pipefail
          API_URL="https://github.com/${API_REPO}.git"

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag }}"
            SHA="${{ github.event.client_payload.sha }}"
          else
            TAG="${{ github.event.inputs.api_ref }}"
            if [ -z "$TAG" ]; then
              TAG=$(git ls-remote --tags --refs "$API_URL" 'v[0-9]*.[0-9]*.[0-9]*' \
                | awk -F/ '{print $NF}' | sort -V | tail -1)
            fi
            SHA=$(git ls-remote "$API_URL" "refs/tags/${TAG}" | cut -f1)
          fi

          if [ -z "$TAG" ]; then echo "::error::No spec tag found on ${API_REPO}"; exit 1; fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::syncing ${TAG}"

      - name: Check out utos/api at the spec tag
        uses: actions/checkout@v7
        with:
          repository: ${{ env.API_REPO }}
          ref: ${{ steps.spec.outputs.tag }}
          path: _api

      - name: Vendor proto + conformance, regenerate
        run: |
          set -euo pipefail

          # The spec this repo implements, recorded where CI can check it. Written here because
          # this is the moment it changes, so the bump travels in the same PR as the protos the
          # implementation will be written against — and scripts/check-version-parity.sh then
          # refuses a release whose version names a different minor.
          echo "${{ steps.spec.outputs.version }}" > SPEC_VERSION

          rm -rf proto && mkdir proto
          cp -r _api/workflow _api/daemon proto/
          # The corpus is vendored beside the protos so the tests run the same cases every other
          # SDK does, rather than a local copy free to drift.
          rm -rf conformance
          cp -r _api/conformance conformance
          rm -rf _api

      # Reported, never gated — including the build. A spec release that changes the protos in a
      # breaking way CANNOT compile here: the implementation that answers it is what this PR is
      # asking someone to write. 0.20.0 was the first such release, and because the build sat in
      # the vendoring step above, the job died before opening a PR — so the protos the fix had to
      # be written against never arrived. Whatever happens here is a to-do in the PR body.
      - name: Build and run the corpus, for the record
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet build Utos.slnx -c Release 2>&1 | tee build.log
          dotnet test Utos.slnx -c Release --no-build 2>&1 | tee corpus.log
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Summarise the result
        id: summary
        if: always()
        run: |
          set -uo pipefail
          count() { grep -cE "$1" "$2" 2>/dev/null | tr -d "[:space:]" || true; }

          if [ "${{ steps.check.outputs.passed }}" = "true" ]; then
            BODY="All tests pass against the new corpus. Nothing here needs implementing."
          elif ! grep -q "Build succeeded" build.log 2>/dev/null; then
            ERRORS=$(count "error [A-Z]+[0-9]+" build.log)
            ERRS=$(grep -oE "error [A-Z]+[0-9]+.*" build.log 2>/dev/null | sort -u | head -10)
            HEAD="**The source does not compile against the new protos** (${ERRORS:-0} compiler error(s)). That is what a breaking spec release looks like from here: the types changed and the implementation has not caught up. The first few:"
            TAIL="Merging this lands the protos and the corpus so the implementation can be written against exactly what it must satisfy."
            BODY=$(printf "%s\n\n\`\`\`\n%s\n\`\`\`\n\n%s" "$HEAD" "$ERRS" "$TAIL")
          else
            FAILURES=$(count "\[FAIL\]" corpus.log)
            BODY="**${FAILURES:-0} test(s) fail against the new corpus.** That is expected for a spec that adds rules: the fixtures arrive with the spec and the implementation follows them. Merging this lands the protos and the corpus so that implementation can be written against exactly what it must satisfy."
          fi

          # A multi-line value needs the delimiter form. Plain `body=...` stops at the first
          # newline, which is the second way this step failed on 0.20.0.
          {
            echo "body<<SYNC_EOF"
            echo "$BODY"
            echo "SYNC_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.spec.outputs.tag }}
          SHA: ${{ steps.spec.outputs.sha }}
          # Through the environment, never interpolated into the script: the summary carries
          # backticks and a fenced block, and a `${{ }}` inside double quotes would hand them to
          # the shell, which ate the whole block on 0.20.0.
          SUMMARY: ${{ steps.summary.outputs.body }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="spec/${TAG}"
          git add SPEC_VERSION proto conformance
          git add src/**/Generated 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "::notice::${TAG} brings no change to SPEC_VERSION, protos, corpus or generated source; nothing to open."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git commit -m "chore: vendor ${API_REPO}@${TAG}

          Regenerated from the spec tag: protos, conformance corpus, generated source.
          Utos-api-sha: ${SHA}"

          git push --force-with-lease origin "$BRANCH"

          {
            printf "Regenerated from [\`%s\`](https://github.com/%s/releases/tag/%s) (\`%s\`): protos, conformance corpus, generated source.\n\n" "$TAG" "$API_REPO" "$TAG" "$SHA"
            printf "%s\n\n" "$SUMMARY"
            printf "Opened automatically by \`sync-spec.yml\`. This is input to work, not a release — nothing is published until a \`dev\` -> \`main\` merge with a dated version in CHANGELOG.md.\n"
          } > pr-body.md

          # Reopen rather than duplicate if a sync for this tag is already waiting, and keep its
          # body current either way.
          NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh pr create --base dev --head "$BRANCH" --title "chore: vendor spec ${TAG}" --body-file pr-body.md
          else
            gh pr edit "$NUM" --body-file pr-body.md
            echo "::notice::a PR for ${BRANCH} is already open; updated it."
          fi
