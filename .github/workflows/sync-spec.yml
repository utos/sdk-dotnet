name: Sync spec

# Regenerating and releasing are different things, and this workflow is the first half.
#
# utos/api fires `spec-released` on every spec release. What arrives with it is INPUT TO WORK:
# new protos, and a conformance corpus that asserts rules nothing here implements yet. That is
# the normal order — fixtures arrive with the spec, implementations follow them — so the arrival
# of a spec is not the moment to publish anything.
#
# So this opens a pull request against `dev` carrying the regenerated source, and stops. A human
# reviews it, merges it, writes the implementation the new corpus demands, and releases when the
# repo is actually ready. `release.yml` is the second half and runs off `main`.
#
# What this replaces: the dispatch used to regenerate AND publish, straight off `main`. That is
# how `Utos.Workflow.Validation 0.0.18` reached nuget.org without implementing a single rule of
# spec 0.0.18 — its version named a spec it had not been taught. A version can only mean "the
# spec I implement" if a person decides when that is true.

on:
  repository_dispatch:
    types: [spec-released]
  workflow_dispatch:
    inputs:
      api_ref:
        description: 'utos/api tag to sync, e.g. v0.19.0 (empty = latest released tag)'
        required: false
        default: ''

permissions:
  contents: write        # push the sync branch
  pull-requests: write   # open the PR

concurrency:
  group: sync-spec
  cancel-in-progress: false

env:
  API_REPO: utos/api

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve the spec tag
        id: spec
        run: |
          set -euo pipefail
          API_URL="https://github.com/${API_REPO}.git"

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag }}"
            SHA="${{ github.event.client_payload.sha }}"
          else
            TAG="${{ github.event.inputs.api_ref }}"
            if [ -z "$TAG" ]; then
              TAG=$(git ls-remote --tags --refs "$API_URL" 'v[0-9]*.[0-9]*.[0-9]*' \
                | awk -F/ '{print $NF}' | sort -V | tail -1)
            fi
            SHA=$(git ls-remote "$API_URL" "refs/tags/${TAG}" | cut -f1)
          fi

          if [ -z "$TAG" ]; then echo "::error::No spec tag found on ${API_REPO}"; exit 1; fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::syncing ${TAG}"

      - name: Check out utos/api at the spec tag
        uses: actions/checkout@v7
        with:
          repository: ${{ env.API_REPO }}
          ref: ${{ steps.spec.outputs.tag }}
          path: _api

      - name: Vendor proto + conformance, regenerate
        run: |
          set -euo pipefail

          # The spec this repo implements, recorded where CI can check it. Written here because
          # this is the moment it changes, so the bump travels in the same PR as the protos the
          # implementation will be written against — and scripts/check-version-parity.sh then
          # refuses a release whose version names a different minor.
          echo "${{ steps.spec.outputs.version }}" > SPEC_VERSION

          rm -rf proto && mkdir proto
          cp -r _api/workflow _api/daemon proto/
          # The corpus is vendored beside the protos so the tests run the same cases every other
          # SDK does, rather than a local copy free to drift.
          rm -rf conformance
          cp -r _api/conformance conformance
          rm -rf _api
          dotnet build Utos.slnx -c Release

      # Reported, never gated. The new corpus is expected to fail here — that is what the PR is
      # asking someone to fix — so the result goes in the PR body as a to-do rather than as an
      # obstacle to landing the protos the fix will be written against.
      - name: Run the corpus, for the record
        id: corpus
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet test Utos.slnx -c Release --no-build 2>&1 | tee corpus.log
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Summarise the corpus result
        id: summary
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.corpus.outputs.passed }}" = "true" ]; then
            echo "body=All tests pass against the new corpus. Nothing here needs implementing." >> "$GITHUB_OUTPUT"
          else
            FAILURES=$(grep -oE '\[FAIL\]' corpus.log | wc -l || echo 0)
            echo "body=**${FAILURES} test(s) fail against the new corpus.** That is expected for a spec that adds rules: the fixtures arrive with the spec and the implementation follows them. Merging this lands the protos and the corpus so that implementation can be written against exactly what it must satisfy." >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.spec.outputs.tag }}
          SHA: ${{ steps.spec.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="spec/${TAG}"
          git add SPEC_VERSION proto conformance src/**/Generated

          if git diff --cached --quiet; then
            echo "::notice::${TAG} brings no change to SPEC_VERSION, protos, corpus or generated source; nothing to open."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git commit -m "chore: vendor ${API_REPO}@${TAG}

          Regenerated from the spec tag: protos, conformance corpus, generated source.
          Utos-api-sha: ${SHA}"

          git push --force-with-lease origin "$BRANCH"

          # Reopen rather than duplicate if a sync for this tag is already waiting.
          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create --base dev --head "$BRANCH" \
              --title "chore: vendor spec ${TAG}" \
              --body "$(printf '%s\n\n%s\n\n%s\n' \
                "Regenerated from [\`${TAG}\`](https://github.com/${API_REPO}/releases/tag/${TAG}) (\`${SHA}\`): protos, conformance corpus, generated source." \
                "${{ steps.summary.outputs.body }}" \
                "Opened automatically by \`sync-spec.yml\`. This is input to work, not a release — nothing is published until a \`dev\` -> \`main\` merge with a dated version in CHANGELOG.md.")"
          else
            echo "::notice::a PR for ${BRANCH} is already open; updated it."
          fi
