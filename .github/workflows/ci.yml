name: CI

# Builds the SDK and verifies the committed generated source is in sync with the
# vendored proto under the pinned Grpc.Tools (the "drift" safety net). Runs on PRs
# and pushes; does not publish.
#
# `dev` is the integration branch and `main` is the release branch, so both are covered:
# a PR into `dev` is gated here, and the dev -> main merge that releases is gated again
# before release.yml acts on it.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    name: Build & drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # First, because it is the cheapest thing that can be wrong and the most expensive to
      # discover late: at release time the mistake is a tag and a published package.
      - name: Version parity
        run: scripts/check-version-parity.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build (regenerates Generated/ in-place)
        run: dotnet build Utos.slnx -c Release

      - name: Verify committed generated source matches proto + pinned tooling
        run: |
          if ! git diff --exit-code -- 'src/**/Generated/**/*.cs'; then
            echo "::error::Committed generated source is out of date. Run 'dotnet build' and commit the changes under src/**/Generated/."
            exit 1
          fi

      - name: Test (content-digest helper + conformance)
        run: dotnet test Utos.slnx -c Release --no-build

      - name: Pack (validate packaging)
        run: dotnet pack Utos.slnx -c Release -p:Version=0.0.0-ci
