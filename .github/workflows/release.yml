name: Release

# The deliberate half. `sync-spec.yml` brings a new spec in as a pull request; this publishes,
# and only when a person has said the repo is ready by dating a version in CHANGELOG.md.
#
# Branches: `dev` integrates, `main` releases. The `dev` -> `main` merge IS the release, so a
# week of work costs one version rather than one per merge. `main` only ever contains released
# state.
#
# The version is read from CHANGELOG.md, exactly as utos/api does it — the first heading carrying
# a date. Nothing is derived from the spec tag any more. That indirection is what let a package
# claim a spec version it had not implemented: the number was computed from what utos/api had
# published rather than from what this repo could actually do. A heading a human dated cannot
# make that mistake.
#
# Version parity across the Utos repos: the MINOR is the contract and the PATCH is this repo's
# own. 0.19.x in any repo means "implements spec 0.19". A repo with nothing to change simply does
# not release, and its latest 0.19.x stays current — which is now true rather than papered over.

on:
  push:
    branches: [main]

permissions:
  contents: write   # commit the changelog date + push the tag
  id-token: write   # OIDC token for nuget.org Trusted Publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need all tags to tell a re-run from a new release

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Read the version from CHANGELOG.md
        id: version
        run: |
          set -euo pipefail

          # The first heading with a date. An undated one is still being written; `Unreleased` is
          # where notes accumulate. Dating a heading is how this repo says "ship this".
          LINE=$(grep -m1 '^\#\# \[.*\] - [0-9]' CHANGELOG.md || true)

          if [ -z "$LINE" ]; then
            echo "::error::No dated version in CHANGELOG.md. Add a date to the version heading you intend to release (e.g. '## [0.19.0] - 2026-09-20')."
            exit 1
          fi

          VERSION=$(echo "$LINE" | sed 's/.*\[\(.*\)\].*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::releasing ${VERSION}"

      - name: Skip if this version is already released
        id: gate
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::notice::v${{ steps.version.outputs.version }} is already tagged; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.gate.outputs.publish == 'true'
        run: dotnet build Utos.slnx -c Release

      # A hard gate here, unlike in sync-spec.yml. A release says the repo implements the spec it
      # names, and the corpus is what decides whether that is true. Failing here costs a re-run;
      # publishing a package that fails its own corpus costs a version that cannot be unpublished.
      - name: Test
        if: steps.gate.outputs.publish == 'true'
        run: dotnet test Utos.slnx -c Release --no-build

      - name: Verify the committed generated source is in sync
        if: steps.gate.outputs.publish == 'true'
        run: |
          if ! git diff --exit-code -- 'src/**/Generated/**/*.cs'; then
            echo "::error::Committed generated source is out of date. Run 'dotnet build' and commit the changes under src/**/Generated/."
            exit 1
          fi

      - name: Pack
        if: steps.gate.outputs.publish == 'true'
        run: dotnet pack Utos.slnx -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: Tag
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived nuget.org API key
      # (no stored secret). Requires a trusted-publishing policy on nuget.org bound to repo
      # utos/sdk-dotnet + workflow release.yml, owner = Utos.
      - name: Authenticate to nuget.org (Trusted Publishing)
        if: steps.gate.outputs.publish == 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          dotnet nuget push 'artifacts/*.nupkg' \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # `main` moved and `dev` did not, so the next merge would carry a needless conflict. Last,
      # and only after the push to nuget.org: `dev` moving means the release landed.
      - name: Fast-forward dev to the released commit
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if ! git fetch --quiet origin dev; then
            echo "::notice::no dev branch on origin; nothing to fast-forward"
            exit 0
          fi
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            git push origin HEAD:dev
            echo "::notice::dev fast-forwarded to v${{ steps.version.outputs.version }}"
          else
            echo "::warning::dev has commits that are not on main, so it could not be fast-forwarded. Run 'git checkout dev && git merge main && git push' to bring it across."
          fi
