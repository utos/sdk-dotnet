name: Release

# Builds and publishes the packages for a release tag, from this repository's own source, so the
# run that produced them is public and the packages carry a signed provenance attestation that
# names it.
#
# Only a tag starts it, and the tag is created by the Utos release, which decides the version and
# which components carry it. A push to a branch never publishes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # the GitHub release
  id-token: write       # nuget.org Trusted Publishing, and signing the attestation
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: The version this tag releases
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          grep -qE "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no dated heading for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A hard gate: a package that fails its own corpus is a version that cannot be unpublished.
      - name: Build and test
        run: |
          dotnet build Utos.slnx -c Release
          dotnet test Utos.slnx -c Release --no-build
      - name: Pack
        run: dotnet pack Utos.slnx -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*.nupkg

      - name: Authenticate to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        run: |
          dotnet nuget push 'artifacts/*.nupkg' \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="## [$VERSION]" 'index($0, v) == 1 { grab = 1; next } /^## \[/ && grab { exit } grab { print }' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
